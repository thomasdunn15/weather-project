<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover: without it env(safe-area-inset-*) is 0 and the fixed
     bottom nav sits under the iPhone home indicator. theme-color paints
     Safari's own chrome the page colour instead of white. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#090D15" />
<title>weather · kalshi trading desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ISOBAR split stylesheets, in cascade order -->
<link rel="stylesheet" href="/static/css/tokens.css?v=8">
<link rel="stylesheet" href="/static/css/shell.css?v=8">
<link rel="stylesheet" href="/static/css/components.css?v=10">
<link rel="stylesheet" href="/static/css/live.css?v=10">
<link rel="stylesheet" href="/static/css/backtest.css?v=8">
<link rel="stylesheet" href="/static/css/accounting.css?v=10">
<link rel="stylesheet" href="/static/css/digest.css?v=1">
<link rel="stylesheet" href="/static/css/responsive.css?v=8">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="glyph"></span>
      <span class="name">WEATHER · KALSHI</span>
      <span class="sub">trading desk</span>
    </div>
    <span class="env-badge live" id="env-badge">LIVE</span>
    <span class="spacer"></span>
    <span class="clock" id="clock"><span class="utc"></span></span>
    <span class="refresh-pill"><span class="dot live"></span><span id="refresh-label">connecting…</span></span>
  </header>

  <nav class="tabbar" role="tablist" aria-label="Dashboard views">
    <!-- data-short: the label the phone bottom bar shows (six tabs in 430px
         leaves ~67px each). responsive.css swaps .lbl for it under 520px. -->
    <button id="tab-live" class="on" role="tab" aria-selected="true" aria-controls="section-live" onclick="switchTab('live')" data-short="Live"><span class="lbl">Live Trading</span></button>
    <button id="tab-backtest" role="tab" aria-selected="false" aria-controls="section-backtest" onclick="switchTab('backtest')" data-short="Backtest"><span class="lbl">Backtest</span></button>
    <button id="tab-polymarket" role="tab" aria-selected="false" aria-controls="section-polymarket" onclick="switchTab('polymarket')" data-short="Poly"><span class="lbl">Polymarket</span></button>
    <button id="tab-forecastex" role="tab" aria-selected="false" aria-controls="section-forecastex" onclick="switchTab('forecastex')" data-short="Robinhood"><span class="lbl">Robinhood</span></button>
    <button id="tab-accounting" role="tab" aria-selected="false" aria-controls="section-accounting" onclick="switchTab('accounting')" data-short="Acct"><span class="lbl">Accounting</span></button>
    <button id="tab-digest" role="tab" aria-selected="false" aria-controls="section-digest" onclick="switchTab('digest')" data-short="Digest"><span class="lbl">Digest</span></button>
  </nav>

  <main>
    <section id="section-live" role="tabpanel" aria-label="Live trading">
      <div class="wrap" id="live-root"><div class="loading">Loading live data…</div></div>
    </section>
    <section id="section-backtest" role="tabpanel" aria-label="Backtest" hidden>
      <div id="backtest-root"><div class="wrap"><div class="loading">Loading backtest…</div></div></div>
    </section>
    <section id="section-polymarket" role="tabpanel" aria-label="Polymarket" hidden>
      <div id="polymarket-root"><div class="wrap"><div class="loading">Loading Polymarket…</div></div></div>
    </section>
    <section id="section-forecastex" role="tabpanel" aria-label="Robinhood" hidden>
      <div id="forecastex-root"><div class="wrap"><div class="loading">Loading Robinhood…</div></div></div>
    </section>
    <section id="section-accounting" role="tabpanel" aria-label="Accounting" hidden>
      <div id="accounting-root"><div class="wrap"><div class="loading">Loading accounting…</div></div></div>
    </section>
    <section id="section-digest" role="tabpanel" aria-label="Digest" hidden>
      <div id="digest-root"><div class="wrap"><div class="loading">Loading digest…</div></div></div>
    </section>
  </main>
</div>
<script src="/static/app.js?v=20"></script>
</body>
</html>
